; ---------------------------------------------------------------------------
; What counts as forbidden is decided by the form lists in Aetherial Bloodlines.esp, not here:
;   Apo_Bosmer_ForbiddenPlants
;   Apo_Bosmer_ForbiddenTrees
;   Apo_Bosmer_ForbiddenIngredients
