; ---------------------------------------------------------------------------
; [Settings] is what a NEW GAME starts each in-game menu option at. Modlist authors set them here.
;
; Changing an option in the F1 menu affects the current save only and never writes to this file,
; so a player can always adjust their own game without losing what you chose for the next one.
; Delete a line to leave that option at whatever the plugin's own record says.
; ---------------------------------------------------------------------------

[Settings]
; Every race trades a strength for a weakness. 0 keeps the strengths and drops the weaknesses.
RacialDrawbacks = 1

; Health percentage at or below which a Dunmer's Veloth's Pyre answers, once per fight. 0 to 30, 0 is off.
PyreHealth = 20

; Percentage a Nord's kill takes off a recovering shout, once per shout. 0 to 50, 0 is off.
ThuumCooldown = 33

; Whether that kill also sharpens melee blows, normal swings and power attacks alike.
ThuumMelee = 0

; Whether it puts a further bonus on power attacks specifically. With both on, a power attack gets each.
ThuumPower = 1

; Percentage of max health an Orsimer's melee hit returns at all ten Oath-Forged stacks, so a tenth
; of it per stack held. Stacks clear on leaving combat. 0 to 5 in tenths, 0 is off.
Bloodthirst = 1.5

; Blows on one target, while dual wielding, that summon a Redguard's Shehai. 2 to 6.
ShehaiHits = 3

; Seconds to land them in. The count resets after this, or on switching target. 1 to 10.
ShehaiWindow = 4.0

; Shortest gap between two blows that both count, in seconds. Dual wielding lands each weapon as a
; separate hit a millisecond apart, so without this one swing counts twice. 0 to 1.
ShehaiGap = 0.25

; Re-apply everything above on every load, not just on a new game. This makes the in-game menu
; effectively read only, so leave it at 0 unless you are deliberately locking a list down.
ForceOnLoad = 0

[GreenPact]
; Also treat Woodcutting Tweaks' own ANDR_ChoppableTreeList as forbidden.
; Harmless if that mod is absent.
bUseChoppableTreeList = 1

; Cast the Green Pact penalty spell when the player activates a forbidden object. If disabled, the player will simply be refused.
bCastPenaltySpell = 1

; Seconds between refusal notifications, so holding the activate key does not spam the screen.
fNotifyCooldown = 4.0

; Extra forbidden base forms by editor ID, comma separated. This is here because i'm lazy (i know, i've done a naughty) and don't want to make a form list for it 
; Requires powerofthree's Tweaks.
ExtraForbiddenForms = WoodChoppingBlock, WoodChoppingBlockSnow, DLC2WoodChoppingBlockAsh, ResourceObjectSawmill

